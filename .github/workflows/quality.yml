name: Quality checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Generate synthetic data
        run: python src/generate_synthetic_data.py

      - name: Build SQLite database
        run: python src/build_service_db.py

      - name: Build analytical summaries
        run: |
          python src/summarize_milestone1.py
          python src/summarize_milestone2.py

      - name: Build and validate dashboard
        run: |
          python src/build_dashboard.py
          python src/validate_dashboard.py

      - name: Validate dataset
        run: python src/validate_dataset.py

      - name: Run tests
        run: python -m pytest -q

      - name: Validate project integrity
        run: python src/validate_project.py
