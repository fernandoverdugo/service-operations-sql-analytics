name: quality-checks

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m compileall -q src tests
      - run: python -m pytest -q
      - run: python src/generate_synthetic_data.py
      - run: python src/build_service_db.py
      - run: python src/summarize_milestone1.py
      - run: python src/validate_dataset.py
